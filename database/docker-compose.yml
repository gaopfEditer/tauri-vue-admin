version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: soybean-admin-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soybean_admin
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
      - soybean_admin_mysql_data:/var/lib/mysql

volumes:
  soybean_admin_mysql_data:
